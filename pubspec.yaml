name: bi_app
description: "BI App - MVP de banca móvil 100% digital y personalizada."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  # equatable 2.x: fake_cloud_firestore aún no es compatible con 3.x
  equatable: ^2.0.7

  # Navegación y DI
  go_router: ^17.2.3
  get_it: ^9.3.0

  # Firebase (plan Spark)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_remote_config: ^6.7.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0

  # Red, almacenamiento local y utilidades
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/config/

# Flutter 3.35.4 fija meta 1.16.0, pero fake_cloud_firestore >= 4.2 (el único
# compatible con cloud_firestore 6.10) exige meta ^1.17. `meta` solo contiene
# anotaciones; quitar este override al subir a Flutter >= 3.38.
dependency_overrides:
  meta: ^1.17.0
