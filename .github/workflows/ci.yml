name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Analyze · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Tests (unit + widget) con cobertura
        run: flutter test --coverage

      - name: Umbral de cobertura (domain + bloc >= 70%)
        run: dart run tool/check_coverage.dart

      # Las credenciales de Firebase no se versionan: se reconstruyen desde
      # GitHub Secrets (FIREBASE_ENV = contenido de .env,
      # GOOGLE_SERVICES_JSON = contenido de android/app/google-services.json).
      - name: Configuración de Firebase desde secrets
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_ENV" ] || [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Faltan los secrets FIREBASE_ENV y/o GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s\n' "$FIREBASE_ENV" > .env
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build APK debug
        run: flutter build apk --debug --dart-define-from-file=.env
